name: PipelineWorkflow

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
    build:
        name: Azure Pipeline
        runs-on: windows-latest

        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

        steps:
        - name: Azure Pipelines Action
          uses: Azure/pipelines@v1
          with:
            azure-devops-project-url: https://dev.azure.com/ddjenkins050284/JobInterview
            azure-pipeline-name: 'DevOpsddjenkins05.gitapp'
            azure-devops-token: ${{ secrets.AZURE_DEVOPS_TOKEN }}